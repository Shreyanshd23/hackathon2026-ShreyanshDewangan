name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-and-evals:
    runs-on: ubuntu-latest
    env:
      OFFLINE_MODE: "1"              # no API keys in CI — deterministic mock LLM
      FAILURE_INJECTION_RATE: "0.0"
      LOG_LEVEL: "ERROR"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -q

      - name: Evaluation gate
        # Fails the build on safety violations, missing terminal actions,
        # invalid tool sequences, or a classification-F1 regression.
        run: python -m evals.runner --gate
