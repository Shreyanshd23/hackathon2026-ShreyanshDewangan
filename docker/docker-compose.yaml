services:
  shopwave-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: shopwave-support-agent:latest
    ports:
      - "5000:5000"
    environment:
      # Secrets come from the environment / .env — never baked into the image.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - OFFLINE_MODE=${OFFLINE_MODE:-0}
      - FLASK_DEBUG=0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://127.0.0.1:5000,http://localhost:5000}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
